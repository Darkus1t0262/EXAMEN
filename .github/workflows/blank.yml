name: Deploy Frontend

on:
  push:
    branches: [ test ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t your-dockerhub-username/dashboard-app .

    - name: Log in to DockerHub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

    - name: Push Docker Image
      run: |
        docker tag your-dockerhub-username/dashboard-app your-dockerhub-username/dashboard-app:latest
        docker push your-dockerhub-username/dashboard-app:latest
